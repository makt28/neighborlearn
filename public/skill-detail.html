<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Detail — NeighborLearn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nl-nav"></div>

  <div class="container my-4" id="detail-root">
    <!-- filled by skill-detail.js -->
  </div>

  <!-- BOOKING MODAL -->
  <div class="modal fade" id="bookModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:var(--nl-radius);">
        <div class="modal-header">
          <h5 class="modal-title">Book a session</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="book-form">
          <div class="modal-body">
            <p id="book-summary" class="text-muted"></p>
            <div class="mb-3">
              <label class="form-label fw-bold">Pick a day</label>
              <div id="book-days" class="d-flex flex-wrap gap-2"></div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Pick a time</label>
              <div id="book-times" class="d-flex flex-wrap gap-2"></div>
            </div>
            <div id="book-error" class="text-danger small d-none mb-2">Please choose a day and a time.</div>
            <div id="book-warning" class="alert alert-warning d-none small mb-0"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-nl-outline" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-nl">Confirm booking</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="nl-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/skill-detail.js"></script>
</body>
</html>
