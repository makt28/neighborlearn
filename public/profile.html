<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile — NeighborLearn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nl-nav"></div>

  <div class="container my-4" id="profile-root"><!-- filled by profile.js --></div>

  <!-- EDIT PROFILE MODAL -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:var(--nl-radius);">
        <div class="modal-header"><h5 class="modal-title">Edit profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="edit-form">
          <div class="modal-body">
            <div class="mb-3"><label class="form-label fw-bold">Name</label>
              <input type="text" id="edit-name" class="form-control" required></div>
            <div class="mb-3"><label class="form-label fw-bold">Neighbourhood</label>
              <input type="text" id="edit-location" class="form-control" required></div>
            <div class="mb-3"><label class="form-label fw-bold">About me</label>
              <textarea id="edit-bio" class="form-control" rows="3"></textarea></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-nl-outline" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-nl">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="nl-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
