<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — NeighborLearn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="nl-auth-bg">
  <div class="container py-5">

    <!-- centered logo + subtitle -->
    <div class="text-center mb-3">
      <a href="index.html" class="text-decoration-none" id="nl-logo-slot"></a>
      <p class="text-muted mt-2 mb-0">Create your account to start learning and teaching with your community.</p>
    </div>

    <div class="nl-auth-card">
      <!-- decorative 2-step progress -->
      <div class="nl-progress mb-4"><span style="width:50%"></span></div>

      <div class="nl-card p-4 p-md-5">
        <h1 class="mb-4">Register</h1>

        <div id="register-error" class="alert alert-danger d-none"></div>

        <form id="register-form" novalidate>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label fw-bold" for="firstName">First name</label>
              <input type="text" id="firstName" class="form-control form-control-lg" placeholder="First name" required>
            </div>
            <div class="col-6">
              <label class="form-label fw-bold" for="lastName">Last name</label>
              <input type="text" id="lastName" class="form-control form-control-lg" placeholder="Last name" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" for="email">Email address</label>
            <input type="email" id="email" class="form-control form-control-lg" placeholder="john@doe.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" for="location">Neighbourhood</label>
            <select id="location" class="form-select form-select-lg" required>
              <option value="" selected disabled>Choose your neighbourhood</option>
              <option>Subang Jaya</option>
              <option>Petaling Jaya</option>
              <option>Shah Alam</option>
              <option>Puchong</option>
              <option>Kuala Lumpur</option>
              <option>Cheras</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" for="password">Password</label>
            <div class="nl-pw-wrap">
              <input type="password" id="password" class="form-control form-control-lg" placeholder="Create a password" required>
              <button type="button" class="nl-pw-toggle" data-target="password" aria-label="Show password"><i class="bi bi-eye"></i></button>
            </div>
            <div class="form-text">Use at least 8 characters with a mix of letters, numbers and symbols.</div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold" for="confirm">Confirm password</label>
            <div class="nl-pw-wrap">
              <input type="password" id="confirm" class="form-control form-control-lg" placeholder="Re-enter your password" required>
              <button type="button" class="nl-pw-toggle" data-target="confirm" aria-label="Show password"><i class="bi bi-eye"></i></button>
            </div>
          </div>

          <!-- kept for validation; agreement is confirmed by the button copy below -->
          <input type="checkbox" id="terms" class="d-none" checked>

          <button type="submit" class="btn btn-nl btn-lg w-100">Continue <i class="bi bi-chevron-right small"></i></button>

          <p class="text-center small text-muted mt-3 mb-0">
            By creating an account, you agree to our <a href="#" class="fw-bold">Terms of Service</a>
            and <a href="#" class="fw-bold">Privacy Policy</a>.
          </p>
        </form>

        <hr class="my-4">
        <p class="text-center small mb-0">Already have an account? <a href="login.html" class="fw-bold">Log in</a>.</p>
      </div>
    </div>

    <p class="text-center small text-muted mt-4 mb-0">© NeighborLearn 2026</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
