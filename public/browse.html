<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Skills — NeighborLearn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nl-nav"></div>

  <div class="container my-4">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active">Browse Skills</li>
      </ol>
    </nav>

    <h1 class="mb-1">Browse Skills</h1>
    <p class="text-muted">Discover what neighbours can teach you.</p>

    <div class="row g-4">
      <!-- FILTER SIDEBAR -->
      <div class="col-lg-3">
        <div class="nl-card p-3">
          <h5 class="mb-3"><i class="bi bi-funnel"></i> Filter</h5>
          <label class="form-label fw-bold">Category</label>
          <select id="f-category" class="form-select"></select>
        </div>
      </div>

      <!-- RESULTS -->
      <div class="col-lg-9">
        <form id="search-form" class="d-flex gap-2 mb-3" role="search" style="max-width:480px;">
          <input id="search-input" class="form-control" type="search" placeholder="Search skills…">
          <button class="btn btn-nl" type="submit"><i class="bi bi-search"></i></button>
        </form>

        <p id="result-count" class="text-muted small"></p>
        <div class="row g-4" id="results"></div>
      </div>
    </div>
  </div>

  <div id="nl-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
