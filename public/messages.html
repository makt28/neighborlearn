<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages — NeighborLearn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nl-nav"></div>

  <div class="container my-4">
    <h1 class="mb-4">Messages</h1>

    <div class="row g-3">
      <!-- LEFT: conversation list -->
      <div class="col-lg-4">
        <div class="nl-card p-3">
          <div class="mb-2">
            <input id="conv-search" class="form-control" type="search" placeholder="Search conversations…">
          </div>
          <div id="conv-list" class="nl-msg-list"><!-- filled by messages.js --></div>
        </div>
      </div>

      <!-- RIGHT: active chat -->
      <div class="col-lg-8">
        <div class="nl-card" id="chat-pane"><!-- filled by messages.js --></div>
      </div>
    </div>
  </div>

  <div id="nl-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
