<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — NeighborLearn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="nl-auth-bg">
  <div class="container py-5">

    <!-- centered logo -->
    <div class="text-center mb-4">
      <a href="index.html" class="text-decoration-none" id="nl-logo-slot"></a>
    </div>

    <div class="nl-auth-card">
      <div class="nl-card p-4 p-md-5">
        <h1 class="mb-4">Welcome back</h1>

        <div id="login-error" class="alert alert-danger d-none"></div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label fw-bold" for="email">Email address</label>
            <input type="email" id="email" class="form-control form-control-lg" placeholder="john@doe.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" for="password">Password</label>
            <div class="nl-pw-wrap">
              <input type="password" id="password" class="form-control form-control-lg" placeholder="********" required>
              <button type="button" class="nl-pw-toggle" data-target="password" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check mb-0">
              <input type="checkbox" id="remember" class="form-check-input">
              <label class="form-check-label small" for="remember">Remember me</label>
            </div>
            <a href="#" class="small fw-bold">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-nl btn-lg w-100">Log in <i class="bi bi-chevron-right small"></i></button>
        </form>

        <hr class="my-4">
        <p class="text-center small mb-0">Don't have an account? <a href="register.html" class="fw-bold">Register</a>.</p>
      </div>

      <div class="alert alert-light border mt-3 small mb-0 text-center">
        <strong>Demo account:</strong> <code>ethan@mail.com</code> / <code>password1</code>
      </div>
    </div>

    <p class="text-center small text-muted mt-4 mb-0">© NeighborLearn 2026</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
