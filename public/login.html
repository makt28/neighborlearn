<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — NeighborLearn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nl-nav"></div>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="nl-card p-4 p-md-5">
          <div class="text-center mb-4">
            <h1><i class="bi bi-house-heart-fill nl-accent"></i></h1>
            <h2>Welcome back</h2>
            <p class="text-muted">Log in to your NeighborLearn account.</p>
          </div>

          <div id="login-error" class="alert alert-danger d-none"></div>

          <form id="login-form" novalidate>
            <div class="mb-3">
              <label class="form-label fw-bold">Email</label>
              <input type="email" id="email" class="form-control form-control-lg" required>
              <div class="invalid-feedback">Please enter a valid email.</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Password</label>
              <input type="password" id="password" class="form-control form-control-lg" required>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
            <button type="submit" class="btn btn-nl btn-lg w-100">Log in</button>
          </form>

          <p class="text-center mt-4 mb-0">New here? <a href="register.html">Create an account</a></p>

          <div class="alert alert-light border mt-4 small mb-0">
            <strong>Demo account:</strong>
            <code>ethan@mail.com</code> / <code>password1</code>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="nl-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
